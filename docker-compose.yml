services:
  web:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PROJECT_ROOT=/app
    volumes:
      - ./oci:/app/oci
      - ./data:/app/data
      - ./ssh:/app/ssh
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  hunter:
    image: ghcr.io/oracle/oci-cli:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./oci:/oracle/.oci
      - ./data:/data
      - ./ssh:/ssh
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/hunter.sh || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    entrypoint:
      - /bin/bash
      - -c
      - "until [ -f /data/hunter.sh ]; do echo 'Waiting for /data/hunter.sh...'; sleep 2; done; sed -i 's/\\r$//' /data/hunter.sh && exec /bin/bash /data/hunter.sh"
