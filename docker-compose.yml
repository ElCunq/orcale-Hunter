services:
  web:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: oracle-a1-web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PROJECT_ROOT=/app
    volumes:
      - ./oci:/app/oci
      - ./data:/app/data
      - ./ssh:/app/ssh
      - /var/run/docker.sock:/var/run/docker.sock

  hunter:
    image: ghcr.io/oracle/oci-cli:latest
    container_name: oracle-a1-hunter
    restart: unless-stopped
    volumes:
      - ./oci:/oracle/.oci
      - ./data:/data
      - ./ssh:/ssh
    entrypoint:
      - /bin/bash
      - /data/hunter.sh
