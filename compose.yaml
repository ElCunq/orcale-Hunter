services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oracle-a1-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_ROOT=/app
    volumes:
      - ./oci:/app/oci
      - ./data:/app/data
      - ./ssh:/app/ssh
      - ./.env:/app/.env
      - ./hunter.sh:/app/hunter.sh
      - /var/run/docker.sock:/var/run/docker.sock

  hunter:
    image: ghcr.io/oracle/oci-cli:latest
    container_name: oracle-a1-hunter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./oci:/oracle/.oci
      - ./data:/data
      - ./ssh:/ssh
      - ./hunter.sh:/hunter.sh
    entrypoint:
      - /bin/bash
      - /hunter.sh
